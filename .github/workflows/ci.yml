name: CI

# Pull-request and main gate. Every check lives in scripts/verify.sh — the
# lockstep version gate plus the node, python, cli and react lanes — which the
# pre-push hook also runs; this file only installs the toolchains and calls it.
# The job id `verify` is the required-check context branch protection names.
#
# Read-only by construction: no permission beyond `contents: read`, no secret,
# no publishing step. Publishing lives in release.yml alone — its FILENAME is
# the npm/PyPI trusted-publisher credential, so it is never edited from here
# and never renamed.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_VERSION: "11.19.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: wrappers
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global "npm@$NPM_VERSION"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m pip install --upgrade build
      - run: bash wrappers/scripts/verify.sh
